<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Web</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- ক্যালকুলেটর মেইন কার্ড (Neumorphic Card) -->
    <div id="mainCard" class="neumorph-card max-w-sm w-full mx-auto rounded-[2.5rem] p-6 transition-all duration-500 relative overflow-hidden">
        
        <!-- সাইড রেইনবো হোভার লাইট গ্লো -->
        <div class="side-rainbow-glow"></div>

        <!-- Display Screen -->
        <div class="relative z-10 mb-6">
            <div id="history" class="text-right text-xs text-slate-400 h-5 overflow-hidden font-mono pr-2"></div>
            <div id="display" class="neumorph-display w-full h-20 text-slate-100 text-3xl font-bold font-mono rounded-2xl flex items-center justify-end px-5 shadow-inner overflow-x-auto">0</div>
        </div>

        <!-- Calculator Keypad Grid -->
        <div class="grid grid-cols-4 gap-3.5 relative z-10">
            <!-- Row 1 -->
            <button onclick="clearAll()" class="neumorph-btn text-emerald-400 font-semibold">AC</button>
            <button onclick="deleteChar()" class="neumorph-btn text-amber-400 font-semibold">DEL</button>
            <button onclick="appendValue('%')" class="neumorph-btn text-sky-400 font-semibold">%</button>
            <button onclick="appendValue('/')" class="neumorph-btn text-sky-400 font-semibold">÷</button>

            <!-- Row 2 -->
            <button onclick="appendValue('7')" class="neumorph-btn text-slate-300">7</button>
            <button onclick="appendValue('8')" class="neumorph-btn text-slate-300">8</button>
            <button onclick="appendValue('9')" class="neumorph-btn text-slate-300">9</button>
            <button onclick="appendValue('*')" class="neumorph-btn text-sky-400 font-semibold">×</button>

            <!-- Row 3 -->
            <button onclick="appendValue('4')" class="neumorph-btn text-slate-300">4</button>
            <button onclick="appendValue('5')" class="neumorph-btn text-slate-300">5</button>
            <button onclick="appendValue('6')" class="neumorph-btn text-slate-300">6</button>
            <button onclick="appendValue('-')" class="neumorph-btn text-sky-400 font-semibold">-</button>

            <!-- Row 4 -->
            <button onclick="appendValue('1')" class="neumorph-btn text-slate-300">1</button>
            <button onclick="appendValue('2')" class="neumorph-btn text-slate-300">2</button>
            <button onclick="appendValue('3')" class="neumorph-btn text-slate-300">3</button>
            <button onclick="appendValue('+')" class="neumorph-btn text-sky-400 font-semibold">+</button>

            <!-- Row 5 -->
            <button onclick="appendValue('00')" class="neumorph-btn text-slate-300">00</button>
            <button onclick="appendValue('0')" class="neumorph-btn text-slate-300">0</button>
            <button onclick="appendValue('.')" class="neumorph-btn text-slate-300">.</button>
            <button onclick="calculateResult()" class="neumorph-btn-equal text-white font-bold">=</button>
        </div>

    </div>

    <!-- Custom JS File -->
    <script src="script.js"></script>
</body>
</html>
