<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Web</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Custom CSS File -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen flex flex-col bg-slate-900 text-slate-100 overflow-x-hidden">
    <script src="https://pl31354033.profitableratecpmnetwork.com/ef/c8/1c/efc81ca453a2a209e6227800dc16ef73.js"></script>

    <!-- Header / Navbar Section -->
    <header
        class="w-full bg-slate-800/80 backdrop-blur-md border-b border-slate-700 py-3 px-6 md:px-12 flex justify-between items-center shadow-lg sticky top-0 z-50">
        <div class="logo text-lg font-bold text-amber-400 tracking-wider">
            Calculator Web
        </div>
        <nav class="hidden md:flex gap-6 text-sm font-medium">
            <a href="index.html" class="hover:text-amber-400 transition">home</a>
            <a href="mailto:iononto2012@gmail.com" target="_blank" class="hover:text-amber-400 transition">contact</a>
        </nav>
        <script src="https://pl31354076.profitableratecpmnetwork.com/81/69/d3/8169d3ffdb85a86b47f49e82312d4654.js"></script>
    </header>

    <!-- Main Container: Left Ads, Center Calculator, Right Ads -->
    <main
        class="flex-grow flex flex-col xl:flex-row justify-center items-center xl:items-center p-4 gap-6 max-w-[1400px] mx-auto w-full my-auto">

        <!-- Left Side Banner Ads (300x250) -->
        <aside class="left-ads w-full xl:w-1/3 flex flex-col gap-4 items-center justify-center">
            <div
                class="ad-box bg-slate-800/50 border border-slate-700/60 rounded-2xl flex items-center justify-center p-2 shadow-inner overflow-hidden">
                <script>
                    atOptions = {
                        'key': '584befcd3af96478f96e87ea38927ff8',
                        'format': 'iframe',
                        'height': 250,
                        'width': 300,
                        'params': {}
                    };
                </script>
                <script src="https://www.highrevenueformat.com/584befcd3af96478f96e87ea38927ff8/invoke.js"></script>
            </div>
        </aside>

        <!-- মূল ক্যালকুলেটর কার্ড (Center Calculator) -->
        <section class="calculator-container flex justify-center items-center w-full xl:w-1/3">
            <div id="mainCard"
                class="neumorph-card max-w-sm w-full mx-auto rounded-[2.5rem] p-6 transition-all duration-500 relative overflow-hidden shadow-2xl">

                <!-- সাইড রেইনবো হোভার লাইট গ্লো -->
                <div class="side-rainbow-glow"></div>

                <!-- Display Screen -->
                <div class="relative z-10 mb-6">
                    <div id="history" class="text-right text-xs text-slate-400 h-5 overflow-hidden font-mono pr-2">
                    </div>
                    <div id="display"
                        class="neumorph-display w-full h-20 text-slate-100 text-3xl font-bold font-mono rounded-2xl flex items-center justify-end px-5 shadow-inner overflow-x-auto">
                        0</div>
                </div>

                <!-- Calculator Keypad Grid -->
                <div class="grid grid-cols-4 gap-3.5 relative z-10">
                    <!-- Row 1 -->
                    <button onclick="clearAll()" class="neumorph-btn text-emerald-400 font-semibold">AC</button>
                    <button onclick="deleteChar()" class="neumorph-btn text-amber-400 font-semibold">DEL</button>
                    <button onclick="appendValue('%')" class="neumorph-btn text-sky-400 font-semibold">%</button>
                    <button onclick="appendValue('/')" class="neumorph-btn text-sky-400 font-semibold">÷</button>

                    <!-- Row 2 -->
                    <button onclick="appendValue('7')" class="neumorph-btn text-slate-300">7</button>
                    <button onclick="appendValue('8')" class="neumorph-btn text-slate-300">8</button>
                    <button onclick="appendValue('9')" class="neumorph-btn text-slate-300">9</button>
                    <button onclick="appendValue('*')" class="neumorph-btn text-sky-400 font-semibold">×</button>

                    <!-- Row 3 -->
                    <button onclick="appendValue('4')" class="neumorph-btn text-slate-300">4</button>
                    <button onclick="appendValue('5')" class="neumorph-btn text-slate-300">5</button>
                    <button onclick="appendValue('6')" class="neumorph-btn text-slate-300">6</button>
                    <button onclick="appendValue('-')" class="neumorph-btn text-sky-400 font-semibold">-</button>

                    <!-- Row 4 -->
                    <button onclick="appendValue('1')" class="neumorph-btn text-slate-300">1</button>
                    <button onclick="appendValue('2')" class="neumorph-btn text-slate-300">2</button>
                    <button onclick="appendValue('3')" class="neumorph-btn text-slate-300">3</button>
                    <button onclick="appendValue('+')" class="neumorph-btn text-sky-400 font-semibold">+</button>

                    <!-- Row 5 -->
                    <button onclick="appendValue('00')" class="neumorph-btn text-slate-300">00</button>
                    <button onclick="appendValue('0')" class="neumorph-btn text-slate-300">0</button>
                    <button onclick="appendValue('.')" class="neumorph-btn text-slate-300">.</button>
                    <button onclick="calculateResult()" class="neumorph-btn-equal text-white font-bold">=</button>
                </div>

            </div>
        </section>

        <!-- Right Side Banner Ads (300x250) -->
        <aside class="right-ads w-full xl:w-1/3 flex flex-col gap-4 items-center justify-center">
            <div
                class="ad-box bg-slate-800/50 border border-slate-700/60 rounded-2xl flex items-center justify-center p-2 shadow-inner overflow-hidden">
                <script>
                    atOptions = {
                        'key': '584befcd3af96478f96e87ea38927ff8',
                        'format': 'iframe',
                        'height': 250,
                        'width': 300,
                        'params': {}
                    };
                </script>
                <script src="https://www.highrevenueformat.com/584befcd3af96478f96e87ea38927ff8/invoke.js"></script>
            </div>
        </aside>

    </main>

    <!-- Footer Section -->
    <footer class="w-full text-center py-3 bg-slate-800/40 border-t border-slate-800 text-slate-500 text-xs">
        &copy; 2026 Calculator Web. All rights reserved.
    <script src="https://pl31354033.profitableratecpmnetwork.com/ef/c8/1c/efc81ca453a2a209e6227800dc16ef73.js"></script>
    
    </footer>

    <!-- Custom JS File -->
    <script src="script.js"></script>
</body>

</html>
